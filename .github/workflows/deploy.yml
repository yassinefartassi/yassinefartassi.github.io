# Builds the static export (out/) and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Site URL: set the repository variable SITE_URL (Settings -> Secrets and variables -> Actions
# -> Variables), e.g. https://yassinefartassi.me, no trailing slash. If unset, the build falls
# back to https://yassinefartassi.github.io (see src/lib/site.ts).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_TELEMETRY_DISABLED: 1

      # House rule: no phone number may ship. Fail the deploy if a likely
      # Moroccan or international phone number appears in the generated HTML/text.
      - name: Check for phone numbers
        run: |
          if grep -rEn --include='*.html' --include='*.txt' --include='*.xml' \
              '(\+212|00212)[ .-]?[5-7]|(^|[^0-9])0[5-7]([ .-]?[0-9]{2}){4}([^0-9]|$)' out; then
            echo "::error::Possible phone number in the build output."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
